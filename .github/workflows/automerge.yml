name: automerge

# The baseline bump, merged without a human. Everything else in this estate still needs
# one; this is the single exception, and it exists because the pin it moves is the one
# whose staleness BLOCKS every other pull request in the repository.
#
# Why a workflow at all, when GitHub has auto-merge: measured on rak200/utils#8, a
# ruleset's `bypass_actors` are NOT consulted when GitHub computes whether a pull
# request is mergeable — only when an actor actually performs the merge. Toggling
# `require_code_owner_review` alone flipped the same pull request CLEAN <-> BLOCKED while
# Dependabot's bypass sat there unchanged, and an admin's bypass did not clear it either.
# Auto-merge waits for mergeable and would therefore wait forever. A direct merge call by
# a bypass actor goes through. So: never `gh pr merge --auto` here.
#
# The bypass this depends on belongs to `github-actions` (app id 15368) on the REVIEW
# ruleset only. The checks ruleset is deliberately separate and grants nothing, so
# `ci / gate` remains enforced by the platform for this path exactly as for a human.
#
# `workflow_run` is not a stylistic choice. A workflow triggered by a Dependabot pull
# request receives a READ-ONLY `GITHUB_TOKEN`, so merging from `pull_request` fails 403.
# `workflow_run` runs in the default branch's context with a full token — and, for the
# same reason, this file is only ever read from the default branch.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  automerge:
    name: automerge
    # Three conditions, and the pull request's author is only one of them. `head_branch`
    # is not trusted for anything: a human can push a branch named like Dependabot's.
    # The identity that matters is the actor GitHub attributes the triggering run to.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # perform the merge
      pull-requests: write   # read the pull request and close it by merging
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # `github.event.workflow_run.pull_requests` is empty often enough to be useless,
      # so the pull request is resolved from the head commit instead.
      - name: Resolve the pull request from the head commit
        id: pr
        run: |
          set -euo pipefail
          number=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open")] | first | .number // empty')
          if [ -z "$number" ]; then
            echo "No open pull request at $HEAD_SHA — nothing to merge."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The guard that makes the exception narrow enough to be worth having. Dependabot
      # updates other ecosystems in these repositories too, and none of them get this
      # treatment: a bump that touches anything besides the baseline pin is an ordinary
      # pull request and waits for a human like everything else.
      - name: The pull request changes nothing but the baseline pin
        if: steps.pr.outputs.number
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPO/pulls/${{ steps.pr.outputs.number }}/files" --paginate \
            --jq '.[].filename' | sort)
          if [ "$files" != ".rak200" ]; then
            echo "Refusing to merge. Changed files:"
            printf '%s\n' "$files" | sed 's/^/  /'
            exit 1
          fi

      # `workflow_run.conclusion` already says the pipeline succeeded, but the ruleset
      # requires the check named `ci / gate`, and those are not the same statement: a
      # workflow can conclude success while the job that publishes the required check was
      # skipped. Assert the name the ruleset actually names.
      - name: The required check is green
        if: steps.pr.outputs.number
        run: |
          set -euo pipefail
          conclusion=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "ci / gate")] | first | .conclusion // empty')
          if [ "$conclusion" != "success" ]; then
            echo "ci / gate is '${conclusion:-absent}', not success."
            exit 1
          fi

      # Squash, to match how every other pull request lands here. The title Dependabot
      # writes is already a conventional commit (`build(deps): ...`), and `build` is a
      # hidden changelog section — a baseline bump moves no version, which is correct:
      # it changes what CI runs, not what the package is.
      - name: Merge
        if: steps.pr.outputs.number
        run: gh pr merge "${{ steps.pr.outputs.number }}" --repo "$REPO" --squash
