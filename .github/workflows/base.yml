name: base

# Language-agnostic half of the pipeline: the conformance checks every rak200 repo
# owes regardless of what it is written in, plus the aggregator that publishes the
# single required check.
#
# A repo with no language calls this directly. A repo with one calls php.yml / js.yml,
# which call this and fold its result into their own gate.

on:
  workflow_call:
    inputs:
      variant:
        description: >
          Scaffold variant whose seeds apply here: none | php | ts | github. Rows marked
          `all` in seeds.tsv apply to every repository regardless.
        type: string
        default: none
      symbol-pattern:
        description: >
          Extended-regex whose first capture group is a public symbol name in src/.
          Empty disables the documentation-coverage check.
        type: string
        default: ''
      publish-gate:
        description: >
          Publish the `gate` job. A language workflow calling this sets it false and
          aggregates in its own gate, so exactly one check carries the name.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0

      # The scaffold lives in the pinned submodule for every consumer — and in the
      # repository itself for rak200/workflow, which IS the source and cannot import
      # itself. Self-conformance is the same check against a different root.
      - name: Locate the scaffold
        id: scaffold
        run: |
          set -euo pipefail
          if [ -d .rak200/scaffold ]; then
            root=.rak200/scaffold
          elif [ -d scaffold ] && [ -f scaffold/seeds.tsv ]; then
            root=scaffold
            echo "::notice::self-conformance — this repo is the scaffold source"
          else
            echo "::error::no scaffold found: neither .rak200/scaffold nor ./scaffold"
            exit 1
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "using $root"

      - name: Seeded files match the pinned scaffold
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -uo pipefail
          root='${{ steps.scaffold.outputs.root }}'
          fail=0
          checked=0
          while IFS=$'\t' read -r variant form seed dest; do
            case "$variant" in ''|'#'*) continue ;; esac
            [ "$variant" = all ] || [ "$variant" = "$VARIANT" ] || continue
            src="$root/$seed"
            if [ ! -f "$src" ]; then
              echo "::error::scaffold is missing $seed (declared in seeds.tsv)"
              fail=1; continue
            fi
            if [ ! -f "$dest" ]; then
              echo "::error file=$dest::seeded file is absent"
              fail=1; continue
            fi
            checked=$((checked + 1))
            case "$form" in
              exact)
                diff -u "$src" "$dest" || { echo "::error file=$dest::seed drift"; fail=1; }
                ;;
              prefix:*)
                n=${form#prefix:}
                if ! diff -u <(head -n "$n" "$src") <(head -n "$n" "$dest"); then
                  echo "::error file=$dest::seeded header (first $n lines) drifted"
                  fail=1
                fi
                ;;
              masked:*)
                pat=${form#masked:}
                if ! diff -u <(sed -E "s#$pat#<masked>#" "$src") \
                             <(sed -E "s#$pat#<masked>#" "$dest"); then
                  echo "::error file=$dest::seed drift outside the masked region"
                  fail=1
                fi
                ;;
              *)
                echo "::error::unknown check form '$form' for $seed"; fail=1 ;;
            esac
          done < "$root/seeds.tsv"
          echo "checked $checked seeded files"
          [ "$checked" -gt 0 ] || { echo "::error::no seeds checked — the manifest matched nothing"; exit 1; }
          exit $fail

      # The check above grades a repository against ITS OWN pinned scaffold, so a stale
      # pin compares an old file to an old seed and passes. The check that exists to
      # detect drift is the one that hides it, by construction.
      #
      # Measured on rak200/utils: pinned eight releases behind, with one `exact` seed
      # changed underneath it — `release-please-config.json`, missing the line that
      # keeps the package name out of the tag. Its next release would have been tagged
      # `utils-4.6.0`, which Composer does not read as a version at all, so the release
      # would have been invisible to every consumer in the estate. Gate green throughout.
      #
      # Deliberately NOT "the pin must be the latest tag". That reddens every repository
      # the moment the baseline cuts a release, for something absent from the pull
      # request — the slow, noisy required check people learn to route around, which is
      # the failure mode this pipeline exists to prevent. It fails on the narrow
      # condition that actually broke: a seed THIS variant consumes changed between the
      # pin and the latest tag, which is exactly when the check above is grading against
      # an obsolete rulebook. A pin that is merely old, with nothing changed underneath
      # it, is harmless and stays quiet.
      - name: The pinned scaffold is not obsolete
        if: ${{ hashFiles('.rak200/scaffold/seeds.tsv') != '' }}
        env:
          VARIANT: ${{ inputs.variant }}
        working-directory: .rak200
        run: |
          set -uo pipefail
          # actions/checkout may leave a submodule shallow, and a shallow clone cannot
          # diff two arbitrary commits — it would fail as a missing object rather than
          # as a finding. Written as an `if` rather than `[ … ] && …` on purpose: GitHub
          # runs this under `bash -e`, where a bare test that returns false ends the step
          # then and there. That has already cost this pipeline two steps.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow --quiet
          fi
          git fetch --tags --quiet origin

          pinned=$(git rev-parse HEAD)
          if ! pin_tag=$(git describe --tags --exact-match "$pinned" 2>/dev/null); then
            echo "::error::.rak200 is pinned at $pinned, which is not a tag. The baseline is tag-pinned by design: a bare commit has no version to reason about, and nothing can say whether it is behind."
            exit 1
          fi
          latest=$(git tag --sort=-v:refname | head -1)
          [ -n "$latest" ] || { echo "::error::the baseline repository has no tags to compare against"; exit 1; }
          echo "pinned $pin_tag, latest $latest"
          if [ "$pin_tag" = "$latest" ]; then
            echo "the pin is current"
            exit 0
          fi

          fail=0
          rows() { git show "$1:scaffold/seeds.tsv" | awk -F'\t' -v v="$VARIANT" '$1=="all"||$1==v'; }

          # The manifest first, and only the rows this variant reads: a row added since
          # the pin is a seed this repository does not know it owes, and no per-seed
          # comparison can find a seed it never looks at. Rows for other variants are
          # not this repository's business — half the manifest's history is the other
          # language arriving.
          if [ "$(rows "$pinned")" != "$(rows "$latest")" ]; then
            echo "::error::the seeds.tsv rows for variant '$VARIANT' changed between $pin_tag and $latest — the manifest this repository is checked against is itself obsolete"
            fail=1
          fi

          # Each seed is compared THE WAY IT IS GRADED. Comparing raw was the first
          # version of this step and it was wrong: it fired on `ci.yml` and `release.yml`,
          # whose only change was the reusable-workflow pin — a region `masked:` removes
          # before grading. That is a difference no check would ever act on, so reporting
          # it makes the estate red for nothing every time the baseline bumps a pin,
          # which is precisely the noisy-required-check shape this step was written to
          # avoid. Caught by running it against rak200/utils before shipping it.
          while IFS=$'\t' read -r _variant form seed _dest; do
            old=$(git show "$pinned:scaffold/$seed" 2>/dev/null || true)
            new=$(git show "$latest:scaffold/$seed" 2>/dev/null || true)
            case "$form" in
              prefix:*)
                n=${form#prefix:}
                old=$(printf '%s\n' "$old" | head -n "$n")
                new=$(printf '%s\n' "$new" | head -n "$n")
                ;;
              masked:*)
                pat=${form#masked:}
                old=$(printf '%s\n' "$old" | sed -E "s#$pat#<masked>#")
                new=$(printf '%s\n' "$new" | sed -E "s#$pat#<masked>#")
                ;;
            esac
            if [ "$old" != "$new" ]; then
              echo "::error::$seed changed between $pin_tag and $latest — this repository is being graded against an obsolete copy of it"
              fail=1
            fi
          done < <(rows "$latest")
          if [ "$fail" -eq 0 ]; then
            echo "nothing this variant consumes changed since $pin_tag — an old pin, harmlessly"
          fi
          exit $fail

      # A mirror badge is checked by anchoring on the shields.io badge KEY and reading
      # the value that follows it. The previous form anchored on a regex whose match
      # swallowed the trailing delimiter, so the extraction that followed it could not
      # emit a value for any badge, present or absent, right or wrong — the step could
      # not fail. It never did, on any repository, which is exactly how it survived.
      - name: README mirror badges match their sources
        run: |
          set -uo pipefail
          [ -f README.md ] || { echo "no README.md — nothing to mirror"; exit 0; }
          fail=0
          verified=0
          # claim <label> <shields badge key, including its trailing '-'> <source value>
          # An absent badge is a failure, not a pass: where the source exists the claim
          # is owed. Silence was the old bug and is not the new behaviour.
          claim() {
            [ -n "$3" ] || return 0
            shown=$(grep -oP "img\.shields\.io/badge/\Q$2\E\K[^-)?]*(?=-)" README.md | head -1 || true)
            if [ -z "$shown" ]; then
              echo "::error file=README.md::$1 badge is absent, but its source says '$3'"
              fail=1; return 0
            fi
            decoded=${shown//%20/ }; decoded=${decoded//%2B/+}
            verified=$((verified + 1))
            if [ "$decoded" != "$3" ]; then
              echo "::error file=README.md::$1 badge says '$decoded', source says '$3'"
              fail=1
            fi
          }
          if [ -f composer.json ]; then
            # The manifest's `^8.4` renders as `8.4+` on the badge. This is the only
            # normalisation: everywhere else the badge carries the source verbatim.
            claim "PHP version" 'php-' \
                  "$(jq -r '.require.php // empty' composer.json | sed 's/^\^//; s/$/+/')"
            claim "License" 'license-' "$(jq -r '.license // empty' composer.json)"
          fi
          # The PHPStan-level claim is NOT made here. Once the level moved into the
          # pinned Layer 2 config, the repository alone no longer states it, and this
          # job has no vendor/ — the claim would silently resolve to nothing. It is
          # made in php.yml, after install, where the effective level is readable.
          echo "verified $verified mirror badges"
          exit $fail

      # `grep -P`, not `-E`: the symbol pattern is PCRE — `(?:` is not ERE syntax, and
      # ERE parses it as something that matches almost nothing. Measured on a real
      # library: 1 symbol found under -E against 358 under -P. The step was green in
      # both cases, and could only be green, because the repositories that ran it had
      # no src/ and returned at the guard above. Hence the vacuity guard below.
      - name: Public symbols appear in docs/
        if: inputs.symbol-pattern != ''
        env:
          PATTERN: ${{ inputs.symbol-pattern }}
        run: |
          set -uo pipefail
          if [ ! -d src ] || [ ! -d docs ]; then
            echo "no src/ or no docs/ — check does not apply"; exit 0
          fi
          fail=0
          found=0
          while read -r symbol; do
            [ -n "$symbol" ] || continue
            found=$((found + 1))
            grep -Rqw -- "$symbol" docs/ || {
              echo "::error::public symbol '$symbol' is documented nowhere in docs/"
              fail=1
            }
          done < <(grep -rhoP "$PATTERN" src/ | grep -oE '[A-Za-z_][A-Za-z0-9_]*$' | sort -u)
          echo "found $found public symbols in src/"
          [ "$found" -gt 0 ] || { echo "::error::src/ exists but the pattern matched no symbol"; exit 1; }
          [ "$fail" -eq 0 ] && echo "every public symbol is documented"
          exit $fail

      - name: Delivered roadmap entries are pruned
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail
          [ -f ROADMAP.md ] || { echo "no ROADMAP.md — nothing to prune"; exit 0; }
          fail=0
          for n in $(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
                     | grep -oiE '(clos(e|es|ed)|fix(es|ed)?|resolv(e|es|ed)) #[0-9]+' \
                     | grep -oE '[0-9]+' | sort -u); do
            if grep -qE "#$n\b" ROADMAP.md; then
              echo "::error file=ROADMAP.md::this PR closes #$n but its roadmap entry is still there"
              fail=1
            fi
          done
          exit $fail

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  gate:
    name: gate
    if: ${{ always() && inputs.publish-gate }}
    needs: [conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Equality with 'success', never inequality with 'failure': equality folds
      # failure, cancelled and skipped alike into a red gate. `if: always()` above is
      # load-bearing — without it a skipped gate counts as satisfied.
      - name: Every job succeeded
        run: |
          echo "conformance: ${{ needs.conformance.result }}"
          [ "${{ needs.conformance.result }}" = "success" ]
