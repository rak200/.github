name: base

# Language-agnostic half of the pipeline: the conformance checks every rak200 repo
# owes regardless of what it is written in, plus the aggregator that publishes the
# single required check.
#
# A repo with no language calls this directly. A repo with one calls php.yml / js.yml,
# which call this and fold its result into their own gate.

on:
  workflow_call:
    inputs:
      variant:
        description: >
          Scaffold variant whose seeds apply here: none | php | ts | github. Rows marked
          `all` in seeds.tsv apply to every repository regardless.
        type: string
        default: none
      symbol-pattern:
        description: >
          PCRE matching a public declaration in src/; the symbol is the last identifier
          of the match, and the pattern needs no capture group. Empty disables the symbol
          half of the documentation check — `docs/` itself is asserted unconditionally.
        type: string
        default: ''
      publish-gate:
        description: >
          Publish the `gate` job. A language workflow calling this sets it false and
          aggregates in its own gate, so exactly one check carries the name.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      # The scaffold lives in the pinned submodule for every consumer — and in the
      # repository itself for rak200/workflow, which IS the source and cannot import
      # itself. Self-conformance is the same check against a different root.
      - name: Locate the scaffold
        id: scaffold
        run: |
          set -euo pipefail
          if [ -d .rak200/scaffold ]; then
            root=.rak200/scaffold
          elif [ -d scaffold ] && [ -f scaffold/seeds.tsv ]; then
            root=scaffold
            echo "::notice::self-conformance — this repo is the scaffold source"
          else
            echo "::error::no scaffold found: neither .rak200/scaffold nor ./scaffold"
            exit 1
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "using $root"

      # Only rak200/.github has reusable workflows to check, and it is the one place a
      # seed can land on top of one. The seeds pin these files by name; nothing before
      # this asserted the named file was still callable.
      #
      # It would have caught the four-release outage the day it started. The `github`
      # variant seeded the repository's own release CALLER to
      # `.github/workflows/release.yml` — the path holding the reusable release
      # workflow — and overwrote it at 1.8.1. Every tag from there on shipped an
      # `on: push` caller under the name the whole estate pins, and the only repository
      # that could notice was pinning @1.8.0, past the breakage. It surfaced four
      # releases later, as a workflow calling itself.
      #
      # The set of reusable workflows is not hardcoded here: it is whatever the seeds
      # pin. A workflow the scaffold tells repositories to call must be callable, and
      # that is the entire assertion.
      - name: Every workflow the seeds pin is callable
        if: ${{ inputs.variant == 'github' }}
        run: |
          set -uo pipefail
          root='${{ steps.scaffold.outputs.root }}'
          names=$(grep -rhoE 'rak200/\.github/\.github/workflows/[a-z0-9-]+\.yml@' "$root" \
            | sed -E 's#.*/##; s#@$##' | sort -u)
          if [ -z "$names" ]; then
            echo "::error::no seed pins a reusable workflow — either the scaffold is empty or this grep stopped matching, and both mean this check is asserting nothing"
            exit 1
          fi
          fail=0
          for name in $names; do
            file=".github/workflows/$name"
            if [ ! -f "$file" ]; then
              echo "::error::the scaffold tells repositories to call $name, and it does not exist here"
              fail=1
              continue
            fi
            # `on:` may carry more than one trigger, so this asks whether the key is
            # present rather than what the file's only trigger is.
            if ! grep -qE '^[[:space:]]*workflow_call:' "$file"; then
              echo "::error file=$file::the scaffold pins this as a reusable workflow, but it declares no workflow_call trigger — a caller of it gets an invalid-workflow error, not a run"
              fail=1
              continue
            fi
            echo "$name is callable"
          done
          exit $fail

      # Only rak200/.github holds the workflows, so only it can check them against the
      # inventory that says what they grade. Rides `ci / gate` rather than publishing a
      # check of its own: a second required context would deadlock every other repository,
      # which never publishes it.
      #
      # RFC 0017 step 5 fires "a canary per gate" against a list that named eight. Step 0
      # read the pipeline on 2026-08-12 and found roughly seventeen — the list "was about to
      # fire eight shots at a target that has changed shape" — and reconciled it by hand.
      # Thirteen days later it was wrong again. Reconciling does not hold; the manifest is
      # what makes a step part of the inventory, exactly as seeds.tsv is what makes a file a
      # seed.
      - name: The gate inventory matches the workflows
        if: ${{ inputs.variant == 'github' }}
        run: scripts/gates.sh

      - name: Seeded files match the pinned scaffold
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -uo pipefail
          root='${{ steps.scaffold.outputs.root }}'
          fail=0
          checked=0
          while IFS=$'\t' read -r variant form seed dest; do
            case "$variant" in ''|'#'*) continue ;; esac
            [ "$variant" = all ] || [ "$variant" = "$VARIANT" ] || continue
            src="$root/$seed"
            if [ ! -f "$src" ]; then
              echo "::error::scaffold is missing $seed (declared in seeds.tsv)"
              fail=1; continue
            fi
            if [ ! -f "$dest" ]; then
              echo "::error file=$dest::seeded file is absent"
              fail=1; continue
            fi
            checked=$((checked + 1))
            case "$form" in
              exact)
                diff -u "$src" "$dest" || { echo "::error file=$dest::seed drift"; fail=1; }
                ;;
              prefix:*)
                n=${form#prefix:}
                if ! diff -u <(head -n "$n" "$src") <(head -n "$n" "$dest"); then
                  echo "::error file=$dest::seeded header (first $n lines) drifted"
                  fail=1
                fi
                ;;
              masked:*)
                pat=${form#masked:}
                if ! diff -u <(sed -E "s#$pat#<masked>#" "$src") \
                             <(sed -E "s#$pat#<masked>#" "$dest"); then
                  echo "::error file=$dest::seed drift outside the masked region"
                  fail=1
                fi
                ;;
              *)
                echo "::error::unknown check form '$form' for $seed"; fail=1 ;;
            esac
          done < "$root/seeds.tsv"
          echo "checked $checked seeded files"
          [ "$checked" -gt 0 ] || { echo "::error::no seeds checked — the manifest matched nothing"; exit 1; }
          exit $fail

      # The check above grades a repository against ITS OWN pinned scaffold, so a stale
      # pin compares an old file to an old seed and passes. The check that exists to
      # detect drift is the one that hides it, by construction.
      #
      # Measured on rak200/utils: pinned eight releases behind, with one `exact` seed
      # changed underneath it — `release-please-config.json`, missing the line that
      # keeps the package name out of the tag. Its next release would have been tagged
      # `utils-4.6.0`, which Composer does not read as a version at all, so the release
      # would have been invisible to every consumer in the estate. Gate green throughout.
      #
      # Deliberately NOT "the pin must be the latest tag". That reddens every repository
      # the moment the baseline cuts a release, for something absent from the pull
      # request — the slow, noisy required check people learn to route around, which is
      # the failure mode this pipeline exists to prevent. It fails on the narrow
      # condition that actually broke: a seed THIS variant consumes changed between the
      # pin and the latest tag, which is exactly when the check above is grading against
      # an obsolete rulebook. A pin that is merely old, with nothing changed underneath
      # it, is harmless and stays quiet.
      - name: The pinned scaffold is not obsolete
        if: ${{ hashFiles('.rak200/scaffold/seeds.tsv') != '' }}
        env:
          VARIANT: ${{ inputs.variant }}
        working-directory: .rak200
        run: |
          set -uo pipefail
          # actions/checkout may leave a submodule shallow, and a shallow clone cannot
          # diff two arbitrary commits — it would fail as a missing object rather than
          # as a finding. Written as an `if` rather than `[ … ] && …` on purpose: GitHub
          # runs this under `bash -e`, where a bare test that returns false ends the step
          # then and there. That has already cost this pipeline two steps.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow --quiet
          fi
          git fetch --tags --quiet origin

          pinned=$(git rev-parse HEAD)
          if ! pin_tag=$(git describe --tags --exact-match "$pinned" 2>/dev/null); then
            echo "::error::.rak200 is pinned at $pinned, which is not a tag. The baseline is tag-pinned by design: a bare commit has no version to reason about, and nothing can say whether it is behind."
            exit 1
          fi
          latest=$(git tag --sort=-v:refname | head -1)
          [ -n "$latest" ] || { echo "::error::the baseline repository has no tags to compare against"; exit 1; }
          echo "pinned $pin_tag, latest $latest"
          if [ "$pin_tag" = "$latest" ]; then
            echo "the pin is current"
            exit 0
          fi

          fail=0
          rows() { git show "$1:scaffold/seeds.tsv" | awk -F'\t' -v v="$VARIANT" '$1=="all"||$1==v'; }

          # The manifest first, and only the rows this variant reads: a row added since
          # the pin is a seed this repository does not know it owes, and no per-seed
          # comparison can find a seed it never looks at. Rows for other variants are
          # not this repository's business — half the manifest's history is the other
          # language arriving.
          if [ "$(rows "$pinned")" != "$(rows "$latest")" ]; then
            echo "::error::the seeds.tsv rows for variant '$VARIANT' changed between $pin_tag and $latest — the manifest this repository is checked against is itself obsolete"
            fail=1
          fi

          # Each seed is compared THE WAY IT IS GRADED. Comparing raw was the first
          # version of this step and it was wrong: it fired on `ci.yml` and `release.yml`,
          # whose only change was the reusable-workflow pin — a region `masked:` removes
          # before grading. That is a difference no check would ever act on, so reporting
          # it makes the estate red for nothing every time the baseline bumps a pin,
          # which is precisely the noisy-required-check shape this step was written to
          # avoid. Caught by running it against rak200/utils before shipping it.
          while IFS=$'\t' read -r _variant form seed _dest; do
            old=$(git show "$pinned:scaffold/$seed" 2>/dev/null || true)
            new=$(git show "$latest:scaffold/$seed" 2>/dev/null || true)
            case "$form" in
              prefix:*)
                n=${form#prefix:}
                old=$(printf '%s\n' "$old" | head -n "$n")
                new=$(printf '%s\n' "$new" | head -n "$n")
                ;;
              masked:*)
                pat=${form#masked:}
                old=$(printf '%s\n' "$old" | sed -E "s#$pat#<masked>#")
                new=$(printf '%s\n' "$new" | sed -E "s#$pat#<masked>#")
                ;;
            esac
            if [ "$old" != "$new" ]; then
              echo "::error::$seed changed between $pin_tag and $latest — this repository is being graded against an obsolete copy of it"
              fail=1
            fi
          done < <(rows "$latest")
          if [ "$fail" -eq 0 ]; then
            echo "nothing this variant consumes changed since $pin_tag — an old pin, harmlessly"
          fi
          exit $fail

      # The same hole as the step above, one level up, and it stayed open longer because
      # the mask that keeps that step quiet is what hides this one. A seed's
      # reusable-workflow pin is graded `masked:`, deliberately — bumping it in the
      # scaffold must not redden every repository at once — so nothing anywhere compared
      # the pin a repository actually runs against the pipeline that exists. Measured
      # across the estate on 2026-08-03: four distinct pins across five repositories, and
      # rak200/workflow, which distributes the seed, was six releases behind the version
      # its own seed named.
      #
      # Dependabot cannot close this: round 3 of the design established that the updater
      # does not bump `jobs.<id>.uses` at all, with a bare tag or a GitHub Release. The
      # RFC therefore records the bump as a manual LIFECYCLE step — and a manual step
      # nothing verifies is the shape this pipeline exists to eliminate.
      #
      # The rule is the seed rule, deliberately: fail when something this repository
      # ACTUALLY RUNS moved, not when the pin is merely old. A pin behind by a release
      # that touched another language's workflow is harmless and stays quiet.
      - name: The pinned pipeline is not obsolete
        run: |
          set -uo pipefail
          # Anchored on `uses:`, because a pin is a directive and not merely the
          # string. The first version matched anywhere in the file and read a comment
          # explaining the convention — `…/release.yml@<tag>` — as a repository pinning
          # a tag literally named `<tag>`. It failed on its first pull request after
          # shipping, against prose describing the very rule it enforces.
          mapfile -t refs < <(
            grep -rhoE '^[[:space:]]*uses:[[:space:]]*rak200/\.github/\.github/workflows/[a-z0-9-]+\.yml@[^[:space:]]+' \
              .github/workflows/ 2>/dev/null \
              | sed -E 's#^[[:space:]]*uses:[[:space:]]*##' | sort -u
          )
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "no rak200/.github reusable workflows are called from here"
            exit 0
          fi

          # A blobless clone: this needs history and tags, not file contents, and
          # `git show` fetches the handful of blobs it actually reads. No token — the
          # baseline is public, and a check that needs credentials to say whether a
          # pin is current is a check that stops working the first time one expires.
          mirror="$RUNNER_TEMP/rak200-github"
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/rak200/.github "$mirror"
          latest=$(git -C "$mirror" tag --sort=-v:refname | head -1)
          [ -n "$latest" ] || { echo "::error::the baseline repository has no tags"; exit 1; }
          body() { git -C "$mirror" show "$2:.github/workflows/$1" 2>/dev/null; }

          fail=0
          for ref in "${refs[@]}"; do
            file=${ref#rak200/.github/.github/workflows/}
            pin=${file##*@}
            file=${file%@*}

            # A moving alias reaches here as a branch name and would otherwise sail
            # through every comparison below, since it is never unequal to itself.
            if ! printf '%s' "$pin" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::$file is pinned to '$pin', which is not a release tag — pin an exact tag, never a moving alias"
              fail=1
              continue
            fi
            if [ "$pin" = "$latest" ]; then
              echo "$file@$pin is current"
              continue
            fi

            # The closure, not the one file: js.yml and php.yml both delegate to
            # base.yml, so a change there reaches a caller whose own file never moved.
            # Resolved from the LATEST revision, because a workflow added since the pin
            # is one this repository does not yet know it runs.
            closure=("$file")
            queue=("$file")
            while [ "${#queue[@]}" -gt 0 ]; do
              current=${queue[0]}
              queue=("${queue[@]:1}")
              while read -r called; do
                [ -n "$called" ] || continue
                for seen in "${closure[@]}"; do [ "$seen" = "$called" ] && continue 2; done
                closure+=("$called")
                queue+=("$called")
              done < <(body "$current" "$latest" \
                | grep -oE 'uses:[[:space:]]*\./\.github/workflows/[a-z0-9-]+\.yml' \
                | grep -oE '[a-z0-9-]+\.yml$' | sort -u)
            done

            moved=()
            for member in "${closure[@]}"; do
              [ "$(body "$member" "$pin")" = "$(body "$member" "$latest")" ] || moved+=("$member")
            done
            if [ "${#moved[@]}" -gt 0 ]; then
              echo "::error::$file is pinned at $pin and ${moved[*]} changed between $pin and $latest — this repository is running an obsolete pipeline"
              fail=1
            else
              echo "$file@$pin is behind $latest, but nothing it runs has changed"
            fi
          done
          exit $fail

      # A mirror badge is checked by anchoring on the shields.io badge KEY and reading
      # the value that follows it. The previous form anchored on a regex whose match
      # swallowed the trailing delimiter, so the extraction that followed it could not
      # emit a value for any badge, present or absent, right or wrong — the step could
      # not fail. It never did, on any repository, which is exactly how it survived.
      - name: README mirror badges match their sources
        run: |
          set -uo pipefail
          [ -f README.md ] || { echo "no README.md — nothing to mirror"; exit 0; }
          fail=0
          verified=0
          # claim <label> <shields badge key, including its trailing '-'> <source value>
          # An absent badge is a failure, not a pass: where the source exists the claim
          # is owed. Silence was the old bug and is not the new behaviour.
          claim() {
            [ -n "$3" ] || return 0
            shown=$(grep -oP "img\.shields\.io/badge/\Q$2\E\K[^-)?]*(?=-)" README.md | head -1 || true)
            if [ -z "$shown" ]; then
              echo "::error file=README.md::$1 badge is absent, but its source says '$3'"
              fail=1; return 0
            fi
            decoded=${shown//%20/ }; decoded=${decoded//%2B/+}; decoded=${decoded//%25/%}
            verified=$((verified + 1))
            if [ "$decoded" != "$3" ]; then
              echo "::error file=README.md::$1 badge says '$decoded', source says '$3'"
              fail=1
            fi
          }
          # Language-specific claims come from the manifest that exists; the License
          # claim is common to both, and it is what keeps this step from grading
          # nothing at all in a repository with no composer.json. Measured 2026-08-27
          # on rak200/ui: `verified 0 mirror badges`, green, with the node badge
          # deliberately wrong — the step made no claim it could fail on.
          manifest=
          if [ -f composer.json ]; then
            manifest=composer.json
            # The manifest's `^8.4` renders as `8.4+` on the badge. This is the only
            # normalisation: everywhere else the badge carries the source verbatim.
            claim "PHP version" 'php-' \
                  "$(jq -r '.require.php // empty' composer.json | sed 's/^\^//; s/$/+/')"
            claim "License" 'license-' "$(jq -r '.license // empty' composer.json)"
            # `infection.json5.dist` is per-repo — copied rather than extended, so unlike
            # the PHPStan level it is readable here with no vendor/. `minCoveredMsi` is
            # the key every PHP repository sets; `caster` also sets `minMsi`, and the two
            # agree. JSON5 carries comments, so this is grep and not jq.
            claim "Infection floor" 'Infection-' \
                  "$(grep -oP '"minCoveredMsi"\s*:\s*\K[0-9]+' infection.json5.dist 2>/dev/null \
                     | head -1 | sed 's/^/min covered MSI /; s/$/%/')"
          elif [ -f package.json ]; then
            manifest=package.json
            # The Node claim is NOT made here: `engines.node` is `>=22.13.0` against a
            # badge reading `22`, and the comparison that knows to take the major lives
            # in js.yml. Same split as the PHPStan level below.
            claim "License" 'license-' "$(jq -r '.license // empty' package.json)"
          fi
          # The PHPStan-level claim is NOT made here. Once the level moved into the
          # pinned Layer 2 config, the repository alone no longer states it, and this
          # job has no vendor/ — the claim would silently resolve to nothing. It is
          # made in php.yml, after install, where the effective level is readable.
          echo "verified $verified mirror badges"
          # A step that verified nothing is not a step that found nothing. Guarded on a
          # manifest being PRESENT, so a prose repository with no manifest to mirror
          # stays quiet rather than red for a condition that is correct.
          if [ -n "$manifest" ] && [ "$verified" -eq 0 ]; then
            echo "::error::$manifest is present and not one badge claim was verified — this step graded nothing"
            fail=1
          fi
          exit $fail

      # `CONVENTIONS.md` §Documentation mandates two different things, and one step
      # asserting both asserted neither. This half is the mandate itself: a repository
      # with source has a `docs/`. It is separate because the branch that used to open
      # the combined step returned green when `docs/` was absent — so deleting `docs/`
      # was how a repository passed, and the one state the rule forbids was the one
      # state the check treated as out of scope. Two of six were passing that way.
      - name: A repository with src/ has docs/
        run: |
          set -uo pipefail
          [ -d src ] || { echo "no src/ — nothing to document"; exit 0; }
          [ -d docs ] || {
            echo "::error::src/ exists and docs/ does not — documentation is mandatory"
            exit 1
          }
          echo "docs/ is present"

      # The other half, and it holds only where a repository's API *is* its exported
      # symbols. A `-config` package's is not: its interface is the verbs it installs
      # and the entry points its manifest declares, and `src/` exists so the binaries
      # and the tests can reach logic that would otherwise sit in a child process,
      # invisible to coverage. Measured on `coding-standard-ts`: `package.json`'s
      # `exports` names five config entry points and no path under `src/`, so nothing
      # there is reachable by a consumer at all. Those variants pass an empty pattern.
      #
      # `grep -P`, not `-E`: the symbol pattern is PCRE — `(?:` is not ERE syntax, and
      # ERE parses it as something that matches almost nothing. Measured on a real
      # library: 1 symbol found under -E against 358 under -P. The step was green in
      # both cases, and could only be green, because the repositories that ran it had
      # no src/ and returned at the guard above. Hence the vacuity guard below.
      - name: Public symbols appear in docs/
        if: inputs.symbol-pattern != ''
        env:
          PATTERN: ${{ inputs.symbol-pattern }}
        run: |
          set -uo pipefail
          [ -d src ] || { echo "no src/ — check does not apply"; exit 0; }
          fail=0
          found=0
          while read -r symbol; do
            [ -n "$symbol" ] || continue
            found=$((found + 1))
            grep -Rqw -- "$symbol" docs/ || {
              echo "::error::public symbol '$symbol' is documented nowhere in docs/"
              fail=1
            }
          done < <(grep -rhoP "$PATTERN" src/ | grep -oE '[A-Za-z_][A-Za-z0-9_]*$' | sort -u)
          echo "found $found public symbols in src/"
          [ "$found" -gt 0 ] || { echo "::error::src/ exists but the pattern matched no symbol"; exit 1; }
          [ "$fail" -eq 0 ] && echo "every public symbol is documented"
          exit $fail

      # The merge is squash-only and the squash message is the PR title, so the title IS
      # the commit — and it is the exact input release-please reads to derive the next
      # version and changelog. RFC 0017 has specified this check from its first revision
      # ("a CI check validates the title against the grammar") and nothing ever
      # implemented it. The failure it leaves open is silent in the worst way: `feature:`
      # for `feat:` does not produce a wrong bump, it produces NO bump, and no gate
      # anywhere says so — the release simply does not happen.
      #
      # The eleven types are the stock `type-enum` of @commitlint/config-conventional,
      # adopted without override. This is not commitlint, and the divergence is stated
      # here rather than discovered later: it asserts the grammar, the type set, a
      # non-empty subject, no trailing full stop and the 100-character header limit — the
      # rules that bind a title that is also a commit. It does not replicate `subject-case`
      # or the body and footer rules, which have no referent when the header is the whole
      # message. Bash, because this file is the language-agnostic half and carries no
      # package manager to run a Node tool from.
      #
      # Every branch below reports its own reason. A single "invalid title" would send the
      # author back to a grammar to diff their string against, which is the shape of error
      # message this pipeline keeps removing.
      - name: The PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail
          types='feat|fix|perf|refactor|style|docs|test|build|ci|chore|revert'
          echo "title: $PR_TITLE"
          fail=0
          # `if !` and never a bare test: GitHub runs this under `bash -e`, where a test
          # returning false ends the step before the diagnosis prints. That has already
          # cost this pipeline two steps.
          if ! printf '%s' "$PR_TITLE" | grep -qE "^($types)(\([^()]+\))?!?: [^[:space:]]"; then
            echo "::error::title is not 'type(scope)?: subject' — type must be one of: ${types//|/, }. A '!' before the colon marks a breaking change."
            fail=1
          fi
          if printf '%s' "$PR_TITLE" | grep -qE '\.$'; then
            echo "::error::title ends in a full stop — it becomes a commit subject, which carries none"
            fail=1
          fi
          if [ "${#PR_TITLE}" -gt 100 ]; then
            echo "::error::title is ${#PR_TITLE} characters, over the 100-character header limit"
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            echo "title is a valid Conventional Commit header"
          fi
          exit $fail

      - name: Delivered roadmap entries are pruned
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail
          [ -f ROADMAP.md ] || { echo "no ROADMAP.md — nothing to prune"; exit 0; }
          fail=0
          for n in $(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
                     | grep -oiE '(clos(e|es|ed)|fix(es|ed)?|resolv(e|es|ed)) #[0-9]+' \
                     | grep -oE '[0-9]+' | sort -u); do
            if grep -qE "#$n\b" ROADMAP.md; then
              echo "::error file=ROADMAP.md::this PR closes #$n but its roadmap entry is still there"
              fail=1
            fi
          done
          exit $fail

      # The detective half of secret scanning; the preventive half is the seeded
      # .githooks/pre-push. Both fired as canaries on rak200/utils on 2026-08-15, and the
      # run's log is why the two env vars below exist — see RFC 0017, *Closing what the
      # campaign opened*.
      #
      # A third layer sits above both and belongs to neither: GitHub push protection
      # rejects high-confidence partner patterns at the remote, before any workflow runs.
      # This step is not redundant with it — gitleaks' default ruleset is broader and
      # provider-agnostic, so this is the layer that catches what has no vendor behind it.
      # The canary only reached this step by planting a secret push protection has no
      # pattern for.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

          # Pinned, because the action otherwise installs a hard-coded default — 8.24.3 —
          # while the pre-push hook runs whatever the operator has locally. One control,
          # two halves, two rule sets, free to diverge: a rule present in one and absent
          # in the other means a secret caught locally sails through CI, or the reverse,
          # and neither half would report anything odd. Pinning the action is half the
          # fix; the hook side is per-clone state no workflow can reach, so the version
          # belongs in the onboarding checklist beside `core.hooksPath`.
          #
          # Bump this deliberately, the way any pin here is bumped.
          GITLEAKS_VERSION: 8.30.1

          # The action tries to comment on the pull request and cannot: this workflow
          # grants `contents: read` and nothing else, so the attempt fails with
          # `Resource not accessible by integration` — twice, as a WARNING, which surfaces
          # nowhere. It was found only by reading the log of a step that had failed for a
          # different reason.
          #
          # Turned off rather than granted, and the choice is the estate's own principle
          # rather than convenience. `pull-requests: write` on the shared pipeline widens
          # the token in every consumer repository, permanently, to decorate a result the
          # required check already carries: the step reddens `ci / gate`, names the file,
          # the line and the rule, and uploads the SARIF. A comment adds no information and
          # costs a permission — the wrong side of the trade this document argues for under
          # *Security of an automated no-PR fan-out*.
          GITLEAKS_ENABLE_COMMENTS: false

  gate:
    name: gate
    if: ${{ always() && inputs.publish-gate }}
    needs: [conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Equality with 'success', never inequality with 'failure': equality folds
      # failure, cancelled and skipped alike into a red gate. `if: always()` above is
      # load-bearing — without it a skipped gate counts as satisfied.
      - name: Every job succeeded
        run: |
          echo "conformance: ${{ needs.conformance.result }}"
          [ "${{ needs.conformance.result }}" = "success" ]
