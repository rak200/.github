name: npm-publish

# Publishes a cut release to npm, with no stored credential.
#
# It exists because the ui pilot cut 0.1.0 and nothing reached a registry: the tag and
# the GitHub Release were the whole release, and `npm install @rak200/ui` — which that
# repository's own README documents — returned 404. PHP hid the gap for a full pilot,
# because Packagist resolves from the git tag, so there the tag IS the publication.
# For npm the tag is nothing.
#
# Two constraints shaped the file, and both are the platform's, not preferences:
#
#   * It must run in the SAME workflow run as release-please. A tag and a Release
#     created with the repository's own GITHUB_TOKEN start no new workflow, so an
#     `on: release: published` job never fires. Hence `needs:` on release.yml's
#     outputs rather than a second event.
#
#   * npm's trusted publishing validates the CALLER workflow's filename, not the one
#     that actually runs `npm publish` — a documented limitation of workflow_call. So
#     the trusted publisher is registered against the consumer's own `release.yml`,
#     and `id-token: write` must be granted on BOTH sides of the call: the caller's
#     job and this job. Granting it in only one place fails at the token exchange.

on:
  workflow_call:
    inputs:
      tag:
        description: 'The tag to publish, from release.yml''s tag_name output.'
        type: string
        required: true
      node-version:
        description: 'Node major used to build and publish. Trusted publishing needs >= 22.14.'
        type: string
        default: '24'

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # the OIDC exchange — this IS the credential
    steps:
      # The tag, not the branch. master may already carry the next commit by the time
      # this job starts, and what was released is what must be published.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      # NO `registry-url`, and that omission is the whole fix for the first publish this
      # workflow ever attempted. `registry-url` makes setup-node write
      #
      #     //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      #
      # into .npmrc unconditionally. With no NODE_AUTH_TOKEN in the environment — which
      # is the entire point of trusted publishing — that line resolves to an EMPTY
      # token, npm considers the registry already authenticated, never attempts the OIDC
      # exchange, and the registry answers an unauthenticated PUT with `404 Not Found`.
      # Upstream: actions/setup-node#1551. The `404` is npm masking 401/403, and it is
      # separately tracked as a bad diagnostic (npm/cli#9088) — it names the package, so
      # it reads like the package does not exist, which is the one thing it is not.
      #
      # npm's own documented example carries `registry-url`. It is written for the token
      # flow and does not survive being reused for the tokenless one. The default
      # registry is already registry.npmjs.org, so dropping it costs nothing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      # Everything the credential-less publish depends on, asserted before the publish
      # rather than diagnosed after it. All three failures otherwise arrive as the same
      # unhelpful 404, which is how the first one cost a release.
      - name: The publish can actually authenticate
        run: |
          set -uo pipefail
          fail=0

          # 1. Trusted publishing needs npm >= 11.5.1. Node 24 ships npm 11; Node 22
          #    ships npm 10, which does not speak the exchange at all.
          have=$(npm --version)
          echo "npm $have"
          if ! printf '11.5.1\n%s\n' "$have" | sort -V -C; then
            echo "::error::trusted publishing needs npm >= 11.5.1, this runner has $have"
            fail=1
          fi

          # 2. The OIDC endpoint has to be reachable, which means id-token: write on
          #    BOTH this job and the caller's — the caller's permissions block is the
          #    ceiling, and capping it produces no error of its own.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::no OIDC token endpoint in the environment — id-token: write is missing from this job or from the caller job that invokes it"
            fail=1
          else
            echo "OIDC token endpoint present"
          fi

          # 3. No auth token line anywhere, from any source. One empty token is enough
          #    to make npm skip the exchange entirely.
          for f in .npmrc "$HOME/.npmrc"; do
            if [ -f "$f" ] && grep -q '_authToken' "$f"; then
              echo "::error::$f sets _authToken — npm will use it instead of the OIDC exchange, and an empty one authenticates as nobody"
              grep -n '_authToken' "$f" | sed 's/=.*/=<redacted>/'
              fail=1
            fi
          done

          # 4. The `validate` verb exists. This job runs it right before publishing, so
          #    the tarball is linted at the only moment that check is worth anything —
          #    and without the script npm exits `Missing script: "validate"` at the last
          #    step, after a full install, having given no warning. Measured on
          #    rak200/coding-standard-ts, which declared no scripts at all: a `-config`
          #    variant calls base.yml rather than js.yml, so the eight-verb assertion
          #    never ran there and the omission survived indefinitely.
          if ! jq -e '.scripts.validate // empty' package.json >/dev/null; then
            echo "::error file=package.json::the 'validate' verb is not declared, and this job runs it before publishing — a package that publishes owes it"
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then
            echo "nothing stands between this job and a tokenless publish"
          fi
          exit $fail

      - name: npm ci
        run: npm ci

      # `validate` is build + publint --strict: the tarball is checked immediately
      # before it is published, which is the only moment the check is worth anything.
      - name: npm run validate
        run: npm run validate

      # No NODE_AUTH_TOKEN, no secret of any kind. npm detects the Actions OIDC context
      # and exchanges it, and provenance is attached automatically for a public package
      # from a public repository. `access` comes from package.json's publishConfig — a
      # scoped package publishes as restricted by default, which fails on a free plan.
      - name: npm publish
        run: npm publish
