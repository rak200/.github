name: php

# The PHP pipeline. Steps invoke verbs (composer <verb>), never tools, which is what
# lets this file and js.yml share a shape — see the RFC's Shared task vocabulary.

on:
  workflow_call:
    # EVERY input here is chosen per VARIANT, never per repository. The caller that passes
    # them is `scaffold/<variant>/ci.yml` in rak200/workflow, seeded and graded byte-for-byte
    # outside its version pin — so a repository cannot pass one without failing `Seeded files
    # match the pinned scaffold`. A repository that needs a different value needs a variant,
    # which is what `ts-config` is: it passes `browser: false` where `ts` leaves it on.
    #
    # An input therefore earns its place only when some variant passes it. Three did not —
    # `runs-on`, `extensions` and `mutation` — and were removed on 2026-08-30 (RFC 0017
    # `E.38`); their values are now literals below. `mutation` was the one worth arguing
    # about: it existed for "a repo that has not reached the floor yet", while the task
    # vocabulary gate requires the `mutation` verb of every repository unconditionally, so
    # the input contradicted a gate that has a canary behind it. The case it was for is
    # already served better — `infection.json5.dist` is per-repo and never a seed, so a
    # repository enters at the floor it has and ratchets, exactly as `.coverage-floor` does.
    inputs:
      variant:
        description: >
          Scaffold variant to grade the seeds against. The `-config` packages run this
          same pipeline — they are npm/Composer packages that ship executable code, and
          a package whose CI never installs it has no CI — but they own a different set
          of seeds, so the variant cannot be baked in here.
        type: string
        default: 'php'
      symbol-pattern:
        description: >
          Extended-regex matching a public symbol in src/. Defaults to this language's.
          A variant passes '' where its API is not its exported symbols: a `-config`
          package's interface is the verbs it installs and the entry points its manifest
          declares, and its `src/` exists so the binaries and tests can reach the logic.
          It disables only the symbol half — `docs/` is still mandatory.
        type: string
        default: '^\s*(?:(?:final|abstract|readonly)\s+)*(?:class|interface|enum|trait)\s+\w+|^\s*public\s+(?:static\s+)?function\s+\w+'
      php-versions:
        description: 'JSON array of PHP versions. The first is the floor: single-run steps ride it.'
        type: string
        default: '["8.4", "8.5"]'
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  base:
    uses: ./.github/workflows/base.yml
    with:
      variant: ${{ inputs.variant }}
      symbol-pattern: ${{ inputs.symbol-pattern }}
      publish-gate: false

  matrix:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Never fail-fast on a version matrix: the useful information is whether a
      # failure is version-specific or general, and cancelling the siblings destroys it.
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
        os: [ubuntu-latest]
    permissions:
      contents: read
      security-events: write   # SARIF upload — not enforced on public repos
      actions: read            # codeql-action reads the run — private repos only
      id-token: write          # Codecov OIDC
    env:
      IS_FLOOR: ${{ matrix.php == fromJSON(inputs.php-versions)[0] && matrix.os == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0   # Infection diffs against origin/master

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath
          coverage: pcov
          tools: composer:v2

      - name: composer validate
        run: composer validate --no-check-publish

      # Libraries commit no composer.lock, so the key is the manifest plus the runtime.
      # Composer's cache holds package archives, not a resolution: a restored cache
      # skips downloads while resolution still happens from scratch.
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.os }}-php${{ matrix.php }}-

      - name: composer install
        run: composer install --prefer-dist --no-progress

      # Layer 1 states that CI asserts the task vocabulary. Until the utils pilot,
      # nothing did — the sentence described a check that was never written.
      #
      # `validate` is asserted ABSENT, which is not an oversight: Composer ships a
      # native command of that name and skips any script that shadows it, under
      # `composer validate` and `composer run-script validate` alike. Declaring it
      # produces configuration that can never execute, and reads as covered.
      - name: The task vocabulary is declared
        if: env.IS_FLOOR == 'true'
        run: |
          set -uo pipefail
          fail=0
          for verb in lint fix analyse test coverage scan mutation; do
            jq -e --arg v "$verb" '.scripts[$v] // empty' composer.json >/dev/null \
              || { echo "::error file=composer.json::the '$verb' verb is not declared"; fail=1; }
          done
          if jq -e '.scripts.validate // empty' composer.json >/dev/null; then
            echo "::error file=composer.json::'validate' must not be declared — Composer skips a script shadowing a native command, so it can never run"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "seven verbs declared, validate correctly absent"
          exit $fail

      # The PHPStan level lives in the pinned Layer 2 config, so the conformance job
      # — which has no vendor/ — cannot read it. The claim is made here instead, and
      # a local override in the repo's own config wins, as it does for the analyser.
      - name: README PHPStan badge matches the effective level
        if: env.IS_FLOOR == 'true'
        run: |
          # `|| true` on both, and it is load-bearing: GitHub runs this with `bash -e`,
          # under which `var=$(grep …)` that matches nothing kills the step on the spot,
          # before one line of the diagnosis below can print. Measured on rak200/utils:
          # the step failed with an empty log and exit 1, which is the same "fails
          # without saying anything" shape this pipeline exists to eliminate.
          set -uo pipefail
          [ -f README.md ] || { echo "no README.md"; exit 0; }
          level=$(grep -oP '(?<=level:\s)\S+' phpstan.neon.dist 2>/dev/null | head -1 || true)
          [ -n "$level" ] || level=$(grep -oP '(?<=level:\s)\S+' \
            vendor/rak200/coding-standard-php/phpstan.neon.dist 2>/dev/null | head -1 || true)
          [ -n "$level" ] || { echo "::error::no PHPStan level found locally or in the pinned standard"; exit 1; }
          shown=$(grep -oP 'img\.shields\.io/badge/PHPStan-level%20\K[^-)?]*(?=-)' README.md | head -1 || true)
          [ -n "$shown" ] || { echo "::error file=README.md::PHPStan badge is absent, but the effective level is '$level'"; exit 1; }
          decoded=${shown//%20/ }
          echo "badge says '$decoded', effective level is '$level'"
          [ "$decoded" = "$level" ]

      - name: composer lint
        if: env.IS_FLOOR == 'true'   # style is version-invariant
        run: composer lint

      - name: composer analyse
        run: composer analyse

      - name: composer test
        run: composer test -- --coverage-clover=coverage.xml

      # The floor is enforced inside the job, from a file in the repo, so the required
      # check never waits on a third party. Codecov below is reporting only.
      - name: composer coverage — floor
        if: env.IS_FLOOR == 'true'
        run: composer coverage

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: env.IS_FLOOR == 'true'
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # semgrep is a Python tool: nothing in the Composer graph installs it, so without
      # this step `composer scan` exits 127 and the scanner that the whole three-step
      # dance below protects is not there at all. Pinned exactly, the way an action is
      # pinned by SHA. Dependabot cannot see a version inside a `run:` step, so this pin
      # moves when the pipeline is released — it is pipeline state, not repo state.
      - name: Install semgrep
        if: env.IS_FLOOR == 'true'
        run: pipx install semgrep==1.172.0

      # Three ordered scanner steps, and the order is the whole point: round 2 found
      # two scanners that captured an exit code and never acted on it. Scan, upload,
      # then enforce — the enforcement step is separate so the upload cannot swallow it.
      - name: composer scan
        if: env.IS_FLOOR == 'true'
        id: scan
        run: |
          set +e
          composer scan
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: ${{ always() && env.IS_FLOOR == 'true' && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif
      - name: Scanner findings block the merge
        if: env.IS_FLOOR == 'true'
        run: |
          echo "scanner exit code: ${{ steps.scan.outputs.code }}"
          [ "${{ steps.scan.outputs.code }}" = "0" ]

      # Mutation runs over the CHANGED LINES on a pull request and in full off that
      # path. A full run is tens of minutes on a real library (~27 on rak200/utils),
      # and a required check that slow is one people learn to route around — which is
      # the failure mode this whole design exists to prevent. The vocabulary still has
      # exactly one mutation verb: Layer 1 owns the word, CI owns when and over what it
      # runs. `--ignore-msi-with-no-mutations` lets a docs-only PR pass instead of
      # failing on zero mutants; the diff base needs the `fetch-depth: 0` above.
      - name: composer mutation — floor (changed lines)
        if: ${{ env.IS_FLOOR == 'true' && github.event_name == 'pull_request' }}
        run: |
          composer mutation -- --git-diff-lines \
            --git-diff-base="origin/${{ github.base_ref }}" \
            --ignore-msi-with-no-mutations

      # The full run is the safety net the diff gate structurally cannot be: a change in
      # one file can stop a test from killing a mutant in a file the diff never touched.
      # Manual, before a significant release — the caller carries `workflow_dispatch`.
      - name: composer mutation — floor (full)
        if: ${{ env.IS_FLOOR == 'true' && github.event_name == 'workflow_dispatch' }}
        run: composer mutation

  gate:
    name: gate
    # Load-bearing: without always() the gate is skipped when a needed job fails, and
    # a skipped required check counts as satisfied.
    if: always()
    needs: [base, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        run: |
          echo "base:   ${{ needs.base.result }}"
          echo "matrix: ${{ needs.matrix.result }}"
          [ "${{ needs.base.result }}" = "success" ] && [ "${{ needs.matrix.result }}" = "success" ]
